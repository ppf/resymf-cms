# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Alert Rules Engine configuration
    alert_rules:
        enabled: true
        default_cooldown: '5 minutes'
        config_path: '%kernel.project_dir%/config/packages/alert_rules.yaml'
        rules: []  # Rules are loaded from config/packages/alert_rules.yaml

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Ensure Twig helpers (e.g., ViteExtension) are always registered
    App\Twig\ViteExtension:
        tags: ['twig.extension']

    # HTML Sanitizer extension for XSS prevention
    App\Twig\HtmlSanitizerExtension:
        arguments:
            $htmlSanitizer: '@html_sanitizer.sanitizer.app.html_sanitizer'
        tags: ['twig.extension']

    # API Rate Limiting listener for abuse prevention
    App\EventListener\ApiRateLimitListener:
        arguments:
            $apiLimiter: '@limiter.api'
            $userCreationLimiter: '@limiter.user_creation'

    # Alert Rules Engine services
    App\Service\AlertRules\AlertRuleParser:
        arguments:
            $configPath: '%kernel.project_dir%/config/packages/alert_rules.yaml'

    App\Service\AlertRules\AlertCooldownManager:
        arguments:
            $alertEventRepository: '@?App\Repository\AlertEventRepository'
            $cache: '@?cache.app'

    App\Service\AlertRules\AlertRulesEngine:
        arguments:
            $entityManager: '@?doctrine.orm.entity_manager'
            $alertEventRepository: '@?App\Repository\AlertEventRepository'
            $config: '%alert_rules%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
